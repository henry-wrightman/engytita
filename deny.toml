# Cargo deny — advisories, licenses, bans for the Engytita workspace.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "thumbv7em-none-eabi" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Transitive UniFFI deps with no safe upgrade yet (unmaintained, not CVEs).
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode via uniffi_macros; wait for UniFFI migration" },
    { id = "RUSTSEC-2024-0436", reason = "paste via uniffi; macro-only, no runtime exposure" },
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
